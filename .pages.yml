          - { name: categoria, label: Categoría, type: string, required: true }
          - { name: reto, label: El reto, type: text, required: true }
          - { name: hicimos, label: Qué hicimos, type: text, required: true }
          - { name: resultado, label: El resultado, type: text, required: true }
          - name: cita
            label: Testimonio completo
